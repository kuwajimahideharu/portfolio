<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>バータイマー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="バータイマー">
<meta name="theme-color" content="#F6EDE3">
<style>
:root{
  --bg:#F6EDE3;
  --peach:#FAD7B8;
  --orange:#DD6B35;
  --orange-soft:#F49E66;
  --ink:#5b4636;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--ink);
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);
  gap:16px;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
h1{
  font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--orange);
  display:flex;align-items:center;gap:8px;
}
h1::before,h1::after{content:"";display:block;width:34px;height:2px;border-radius:2px;background:var(--peach)}

/* ===== 本体（デバイス） ===== */
#device{
  width:100%;max-width:760px;
  background:linear-gradient(175deg,#2b2b2d 0%,#141416 55%,#0c0c0d 100%);
  border-radius:22px;
  padding:16px;
  box-shadow:0 14px 34px rgba(90,55,20,.28), inset 0 1px 0 rgba(255,255,255,.14);
  display:flex;flex-direction:column;gap:12px;
}
@media (min-width:620px){
  #device{flex-direction:row;align-items:stretch}
  #barwin{flex:1.6}
  #lcd{flex:1}
}
.window{
  background:#050505;
  border-radius:12px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.9), inset 0 -1px 0 rgba(255,255,255,.05);
  padding:12px 10px;
}
#barwin{display:flex;gap:4px;align-items:stretch;min-height:96px}
.seg{
  flex:1;border-radius:2.5px;
  background:#161617;
  transition:background .15s,box-shadow .15s;
}
.seg.on-o {background:linear-gradient(180deg,#F0823C,#D95F1E);box-shadow:0 0 10px rgba(240,130,60,.55)}
.seg.on-yg{background:linear-gradient(180deg,#CEDF3A,#AFC420);box-shadow:0 0 10px rgba(200,220,60,.5)}
.seg.on-g {background:linear-gradient(180deg,#39B45E,#249247);box-shadow:0 0 10px rgba(60,180,95,.5)}
.seg.on-b {background:linear-gradient(180deg,#4E92F3,#2C6FDE);box-shadow:0 0 10px rgba(75,145,240,.55)}
.seg.tip{animation:tipPulse 1s ease-in-out infinite}
@keyframes tipPulse{50%{filter:brightness(.55)}}
#device.alarm .seg{animation:alarmFlash .5s steps(1) infinite}
@keyframes alarmFlash{50%{background:#161617;box-shadow:none}}

#lcd{display:flex;align-items:center;justify-content:center;min-height:96px}
#lcd svg{width:100%;max-width:260px;height:auto;display:block}
#device.alarm #lcd svg{animation:lcdFlash .5s steps(1) infinite}
@keyframes lcdFlash{50%{opacity:.12}}

/* ===== 操作部 ===== */
#controls,#presets,#picker{width:100%;max-width:560px}
#presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{
  border:none;border-radius:14px;padding:10px 0;
  background:#fff;color:var(--ink);font-size:15px;font-weight:700;
  box-shadow:0 2px 6px rgba(90,55,20,.12);
  cursor:pointer;
}
.chip:active{transform:scale(.95)}
.chip.sel{background:var(--peach);color:#8a4a1d;box-shadow:inset 0 0 0 2px var(--orange-soft)}
/* くるくるダイヤル（iOS風ホイールピッカー） */
#picker{
  position:relative;display:flex;justify-content:center;gap:36px;
  background:#fff;border-radius:18px;
  box-shadow:0 2px 6px rgba(90,55,20,.12);
}
#pickerBand{
  position:absolute;left:16px;right:16px;top:50%;height:38px;transform:translateY(-50%);
  background:var(--peach);opacity:.45;border-radius:12px;pointer-events:none;
}
.wheelbox{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.wheel{
  height:152px;width:64px;overflow-y:scroll;scroll-snap-type:y mandatory;
  padding:57px 0;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);
  mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);
}
.wheel::-webkit-scrollbar{display:none}
.wheel .item{height:38px;line-height:38px;text-align:center;font-size:24px;font-weight:700;color:var(--ink);scroll-snap-align:center}
.unit{font-size:15px;font-weight:700;color:#9b7150}
#controls{display:flex;gap:12px}
.btn{
  flex:1;border:none;border-radius:18px;padding:16px 0;
  font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 12px rgba(90,55,20,.2);
}
.btn:active{transform:scale(.97)}
#btnStart{background:linear-gradient(135deg,var(--orange-soft),#E06B32);color:#fff}
#btnStart.pause{background:linear-gradient(135deg,#7c8894,#55606b)}
#btnReset{flex:.6;background:#fff;color:#9b7150}
.disabled{opacity:.35;pointer-events:none}
#hint{font-size:12px;color:#b08a68;text-align:center;line-height:1.7}
</style>
</head>
<body>
<h1>ビジュアルバータイマー</h1>

<div id="device">
  <div id="barwin" class="window"></div>
  <div id="lcd" class="window"></div>
</div>

<div id="presets"></div>
<div id="picker">
  <div id="pickerBand"></div>
  <div class="wheelbox"><div class="wheel" id="wMin"></div><span class="unit">分</span></div>
  <div class="wheelbox"><div class="wheel" id="wSec"></div><span class="unit">秒</span></div>
</div>
<div id="controls">
  <button class="btn" id="btnStart">▶ スタート</button>
  <button class="btn" id="btnReset">リセット</button>
</div>
<p id="hint">バーは残り時間。時間が減ると右（青）から消えていきます</p>

<script>
"use strict";
/* ===== 7セグ表示 ===== */
const SEGMAP={0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgedc",7:"abc",8:"abcdefg",9:"abfgcd"};
const t=14,W=62,H=110,d=1.2; // 太さ・digitサイズ・隙間
function segPts(name){
  // 角で45°に噛み合う古典的なLCDレイアウト（隙間は d だけ）
  const y0=(H-t)/2, y1=(H+t)/2, ym=H/2;
  switch(name){
    case"a":return `${d},0 ${W-d},0 ${W-t-d},${t} ${t+d},${t}`;
    case"d":return `${t+d},${H-t} ${W-t-d},${H-t} ${W-d},${H} ${d},${H}`;
    case"g":return `${d},${ym} ${t+d},${y0} ${W-t-d},${y0} ${W-d},${ym} ${W-t-d},${y1} ${t+d},${y1}`;
    case"f":return `0,${d} ${t},${t+d} ${t},${y0-d} 0,${ym-d}`;
    case"b":return `${W},${d} ${W},${ym-d} ${W-t},${y0-d} ${W-t},${t+d}`;
    case"e":return `0,${ym+d} ${t},${y1+d} ${t},${H-t-d} 0,${H-d}`;
    case"c":return `${W},${ym+d} ${W},${H-d} ${W-t},${H-t-d} ${W-t},${y1+d}`;
  }
}
const NS="http://www.w3.org/2000/svg";
function makeDigit(x){
  const grp=document.createElementNS(NS,"g");
  grp.setAttribute("transform",`translate(${x},0) skewX(-4)`);
  const segs={};
  for(const s of "abcdefg"){
    const p=document.createElementNS(NS,"polygon");
    p.setAttribute("points",segPts(s));
    p.setAttribute("fill","#F2F6F8");
    p.setAttribute("opacity","0.05");
    grp.appendChild(p);segs[s]=p;
  }
  return{grp,set(n){const on=n===null?"":SEGMAP[n];for(const s of "abcdefg")segs[s].setAttribute("opacity",on.includes(s)?"1":"0.05");}};
}
const lcd=document.getElementById("lcd");
const svg=document.createElementNS(NS,"svg");
svg.setAttribute("viewBox","0 0 340 130");
const digits=[makeDigit(14),makeDigit(84),makeDigit(178),makeDigit(248)];
digits.forEach(d=>svg.appendChild(d.grp));
// 小数点（M と S の区切り）
const dot=document.createElementNS(NS,"circle");
dot.setAttribute("cx","160");dot.setAttribute("cy","104");dot.setAttribute("r","6");
dot.setAttribute("fill","#F2F6F8");svg.appendChild(dot);
// 単位ラベル M / S
for(const[ch,x]of[["M",152],["S",316]]){
  const tx=document.createElementNS(NS,"text");
  tx.setAttribute("x",x);tx.setAttribute("y","124");
  tx.setAttribute("fill","#F2F6F8");tx.setAttribute("font-size","17");
  tx.setAttribute("font-family","-apple-system,sans-serif");tx.setAttribute("font-weight","600");
  tx.textContent=ch;svg.appendChild(tx);
}
lcd.appendChild(svg);
function showTime(sec){
  const m=Math.min(99,Math.floor(sec/60)),s=sec%60;
  digits[0].set(m>=10?Math.floor(m/10):null);
  digits[1].set(m%10);
  digits[2].set(Math.floor(s/10));
  digits[3].set(s%10);
}

/* ===== バー表示 ===== */
const NSEG=20,GROUPS=["o","o","o","o","o","yg","yg","yg","yg","yg","g","g","g","g","g","b","b","b","b","b"];
const barwin=document.getElementById("barwin");
const segEls=GROUPS.map(c=>{const d=document.createElement("div");d.className="seg";d.dataset.c=c;barwin.appendChild(d);return d;});
function showBars(lit,pulseTip){
  segEls.forEach((el,i)=>{
    el.className="seg"+(i<lit?" on-"+el.dataset.c:"");
    if(pulseTip&&i===lit-1)el.classList.add("tip");
  });
}

/* ===== タイマー本体 ===== */
const device=document.getElementById("device");
const btnStart=document.getElementById("btnStart");
const btnReset=document.getElementById("btnReset");
const presetsEl=document.getElementById("presets");
const pickerEl=document.getElementById("picker");
const PRESETS=[1,3,5,10,15,30,45,60];
let total=+(localStorage.getItem("dur")||1800); // 秒
let state="idle"; // idle|run|pause|alarm
let endAt=0,remainMs=total*1000,timerId=null,wakeLock=null,alarmTimer=null;

PRESETS.forEach(min=>{
  const b=document.createElement("button");
  b.className="chip";b.textContent=min+"分";b.dataset.sec=min*60;
  b.addEventListener("click",()=>{if(state!=="idle")return;total=min*60;remainMs=total*1000;save();syncWheels();render();});
  presetsEl.appendChild(b);
});
function save(){localStorage.setItem("dur",total);}

/* くるくるダイヤル */
const ROWH=38;
const wMin=document.getElementById("wMin"),wSec=document.getElementById("wSec");
for(let i=0;i<=99;i++){const d=document.createElement("div");d.className="item";d.textContent=i;wMin.appendChild(d);}
for(let i=0;i<=59;i++){const d=document.createElement("div");d.className="item";d.textContent=i;wSec.appendChild(d);}
let wheelHold=0,wheelTmr=null;
function syncWheels(){ // total → ホイール位置（プログラム操作はscrollイベントを無視させる）
  wheelHold=Date.now()+500;
  wMin.scrollTop=Math.floor(total/60)*ROWH;
  wSec.scrollTop=(total%60)*ROWH;
}
function onWheelScroll(){
  if(Date.now()<wheelHold||state!=="idle")return;
  clearTimeout(wheelTmr);
  wheelTmr=setTimeout(()=>{
    const m=Math.max(0,Math.min(99,Math.round(wMin.scrollTop/ROWH)));
    const s=Math.max(0,Math.min(59,Math.round(wSec.scrollTop/ROWH)));
    let v=m*60+s;
    if(v<10){v=10;total=v;syncWheels();}else total=v; // 最短10秒
    remainMs=total*1000;save();render();
  },160);
}
wMin.addEventListener("scroll",onWheelScroll);
wSec.addEventListener("scroll",onWheelScroll);

function render(){
  const sec=Math.max(0,Math.ceil(remainMs/1000));
  showTime(state==="idle"?total:sec);
  const frac=(state==="idle"||state==="alarm")?1:remainMs/(total*1000);
  showBars(Math.max(0,Math.min(NSEG,Math.ceil(frac*NSEG))),state==="run");
  // 選択中プリセットのハイライト
  presetsEl.querySelectorAll(".chip").forEach(c=>c.classList.toggle("sel",+c.dataset.sec===total));
  const settable=state==="idle";
  presetsEl.classList.toggle("disabled",!settable);
  pickerEl.classList.toggle("disabled",!settable);
  btnStart.textContent=state==="run"?"⏸ 一時停止":(state==="pause"?"▶ 再開":"▶ スタート");
  btnStart.classList.toggle("pause",state==="run");
  device.classList.toggle("alarm",state==="alarm");
  document.title=state==="run"||state==="pause"?`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")} - バータイマー`:"バータイマー";
}

function tick(){
  remainMs=endAt-Date.now();
  if(remainMs<=0){remainMs=0;finish();return;}
  render();
}
function start(){
  unlockAudio();
  endAt=Date.now()+remainMs;
  state="run";
  timerId=setInterval(tick,200);
  requestWake();
  render();
}
function pause(){
  clearInterval(timerId);timerId=null;
  remainMs=Math.max(0,endAt-Date.now());
  state="pause";releaseWake();render();
}
function reset(){
  clearInterval(timerId);timerId=null;stopAlarm();
  state="idle";remainMs=total*1000;releaseWake();render();
}
function finish(){
  clearInterval(timerId);timerId=null;
  state="alarm";render();
  startBeeps();
  alarmTimer=setTimeout(reset,60000); // 1分で自動停止
}

btnStart.addEventListener("click",()=>{
  if(state==="alarm"){reset();return;}
  if(state==="run")pause();else start();
});
btnReset.addEventListener("click",reset);
device.addEventListener("click",()=>{if(state==="alarm")reset();});

/* ===== アラーム音 =====
   WebAudioはiPhoneの消音スイッチONだと鳴らないため、
   動画再生と同じ扱いになる audio 要素（WAVをその場で生成）で鳴らす */
let beepInt=null,audioReady=false;
try{if("audioSession"in navigator)navigator.audioSession.type="playback";}catch(e){}
function buildBeepWav(){ // 2200Hz矩形波×4連ピピピ（約0.7秒）のWAVを生成
  const sr=22050,beepN=Math.floor(sr*0.11),gapN=Math.floor(sr*0.07),n=4;
  const pcm=new Int16Array(n*(beepN+gapN));
  for(let b=0;b<n;b++){
    const off=b*(beepN+gapN);
    for(let i=0;i<beepN;i++){
      const env=Math.min(1,i/(sr*0.005),(beepN-i)/(sr*0.01));
      pcm[off+i]=(Math.sin(2*Math.PI*2200*i/sr)>=0?1:-1)*0.4*env*32767;
    }
  }
  const buf=new ArrayBuffer(44+pcm.length*2),dv=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");dv.setUint32(4,36+pcm.length*2,true);ws(8,"WAVE");
  ws(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);
  ws(36,"data");dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
const alarmAudio=new Audio(buildBeepWav());
alarmAudio.setAttribute("playsinline","");
function unlockAudio(){ // スタート押下（ユーザー操作）時に一度だけ無音再生して再生許可を得る
  if(audioReady)return;
  alarmAudio.muted=true;
  const p=alarmAudio.play();
  if(p)p.then(()=>{alarmAudio.pause();alarmAudio.currentTime=0;alarmAudio.muted=false;audioReady=true;})
       .catch(()=>{alarmAudio.muted=false;});
}
function playBeep(){alarmAudio.currentTime=0;alarmAudio.play().catch(()=>{});}
function startBeeps(){playBeep();beepInt=setInterval(playBeep,1200);}
function stopAlarm(){
  if(beepInt){clearInterval(beepInt);beepInt=null;}
  alarmAudio.pause();alarmAudio.currentTime=0;
  if(alarmTimer){clearTimeout(alarmTimer);alarmTimer=null;}
}

/* ===== 画面スリープ防止 ===== */
async function requestWake(){
  try{if("wakeLock"in navigator)wakeLock=await navigator.wakeLock.request("screen");}catch(e){}
}
function releaseWake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(state==="run"){tick();requestWake();}
  }
});

render();
syncWheels();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
