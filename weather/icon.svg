  <!-- 太陽 -->
  <circle cx="216" cy="290" r="46" fill="#F6B23C"/>
  <g stroke="#F6B23C" stroke-width="14" stroke-linecap="round">
    <line x1="216" y1="222" x2="216" y2="204"/>
    <line x1="216" y1="358" x2="216" y2="376"/>
    <line x1="148" y1="290" x2="152" y2="290"/>
    <line x1="168" y1="242" x2="155" y2="229"/>
    <line x1="168" y1="338" x2="155" y2="351"/>
    <line x1="264" y1="242" x2="277" y2="229"/>
  </g>

  <!-- 温度計 -->
  <rect x="316" y="228" width="28" height="106" rx="14" fill="#FDEEDF" stroke="#E06B32" stroke-width="10"/>
  <circle cx="330" cy="352" r="30" fill="#E06B32"/>
  <rect x="322" y="276" width="16" height="70" rx="8" fill="#E06B32"/>
</svg>
