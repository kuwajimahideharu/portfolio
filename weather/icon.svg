<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F49E66"/>
      <stop offset="1" stop-color="#E06B32"/>
    </linearGradient>
  </defs>

  <!-- 背景（角丸スクエア・オレンジグラデ） -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- 留めピン（アプリ家族共通モチーフ） -->
  <rect x="182" y="112" width="20" height="48" rx="10" fill="#FFFFFF"/>
  <rect x="310" y="112" width="20" height="48" rx="10" fill="#FFFFFF"/>

  <!-- 白いボード -->
  <rect x="116" y="140" width="280" height="262" rx="38" fill="#FFFFFF"/>

  <!-- ピーチのヘッダー帯 -->
